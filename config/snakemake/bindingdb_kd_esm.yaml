# BindingDB_Kd with ESM-1b sequence embeddings instead of structure contact graphs.
#
# This is the sequence-only arm of the structure-vs-sequence comparison: proteins
# become one mean-pooled 1280-d vector each, with no graph at all. Train it with
# `model.prot.method: vector` (see config/dti/esm.yaml) - the graph encoder cannot
# consume this input.
#
# Needs the optional dependency: `uv sync --extra esm`.
source: datasets/bindingdb_kd/resources
prots:
  features:
    method: esm
parse_dataset:
  # BindingDB_Kd reports Kd in nM; 100 nM is pKd >= 7, as for Davis.
  unit: nM
  threshold: 100
