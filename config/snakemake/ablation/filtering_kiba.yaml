# Ablation axis: which interactions survive binarization.
# `all` keeps everything, `posneg` (the default) keeps only confident positives and
# negatives, `balanced` equalises the classes.
source: datasets/kiba/resources
prots:
  structs:
    method: whole
parse_dataset:
  # KIBA scores are a unitless 0-17.2 scale where HIGHER means a stronger
  # interaction - the opposite of the nM default. 12.1 is the conventional cutoff.
  unit: score
  threshold: 12.1
  filtering: [posneg, all, balanced]
