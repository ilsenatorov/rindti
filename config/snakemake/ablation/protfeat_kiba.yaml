# Ablation axis: how a residue node is encoded.
# `label` is a single integer per residue; `onehot` is a 20-dim indicator.
source: datasets/kiba/resources
prots:
  structs:
    method: whole
  features:
    node_feats: [label, onehot]
parse_dataset:
  # KIBA scores are a unitless 0-17.2 scale where HIGHER means a stronger
  # interaction - the opposite of the nM default. 12.1 is the conventional cutoff.
  unit: score
  threshold: 12.1
