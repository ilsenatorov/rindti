name: torch
channels:
  - pyg
  - pytorch
  - conda-forge

dependencies:
  - python=3.9
  - pytorch=1.10.1
  - torchvision=0.11.2
  - torchaudio=0.10.1
  - cudatoolkit=11.3
  - pyg=2.0.3  # PyTorch Geometric

  # scientific python
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - networkx

  # plotting
  - matplotlib
  - seaborn

  # utils
  - tqdm
  - requests
  - pyyaml

  # pip installs
  - pip
  - pip:
      - pytorch-lightning==1.5.9
      - torchmetrics==0.7.0
      - tensorboard